---
name: Live updater smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  e2e-update:
    name: Full-feed update (UBI 10)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: registry.access.redhat.com/ubi10:latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install Dependencies
        run: dnf install -y make util-linux
      - name: Live update smoke test
        run: make e2e-update
